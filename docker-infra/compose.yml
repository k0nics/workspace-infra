name: dev-infra

services:
  nginx:
    image: nginx:alpine
    container_name: dev-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../repositories/TIS-Admin/public:/sites/tisph-cms/public:ro
      - ../repositories/TIS-Website/public:/sites/tisph-website/public:ro
      - ../repositories/TFS-Website-Revamp-2022/public:/sites/tfs-website/public:ro
      - ../repositories/TFS-Website-Revamp-CMS/public:/sites/tfs-cms/public:ro
      - ../repositories/SGV-Website/public:/sites/sgv-website/public:ro
      - ../repositories/SGV-Website-CMS/public:/sites/sgv-cms/public:ro
      - ../repositories/Ortigas-Land-Website/public:/sites/ortigas-land-website/public:ro
      - ../repositories/Ortigas-Land-CMS/public:/sites/ortigas-land-cms/public:ro
      - ../repositories/globe-digitest/public:/sites/globe-digitest/public:ro
      - ../repositories/TFS-QMS-Cron/public:/sites/qms-cron/public:ro
    networks:
      - dev-network

  mysql:
    image: mysql:8.4
    container_name: dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - dev-network

  adminer:
    image: adminer:standalone
    container_name: dev-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      - dev-network

networks:
  dev-network:
    name: dev-network

volumes:
  mysql-data:
