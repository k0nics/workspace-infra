apiVersion: 1

providers:
  - name: TIS logs
    orgId: 1
    folder: TIS
    folderUid: tis-logs
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/tis

