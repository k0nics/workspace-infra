name: monitoring

services:
  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_DOMAIN: grafana-ben-local.localhost
      GF_SERVER_ROOT_URL: http://grafana-ben-local.localhost:8080

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

    depends_on:
      - loki

    networks:
      - monitoring
      - dev-network

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/config.yml

    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: alloy
    restart: unless-stopped

    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro

      # Laravel logs
      - ../../repositories/TIS-Admin/storage/logs:/var/log/laravel/tisph-cms:ro
      - ../../repositories/TIS-Website/storage/logs:/var/log/laravel/tisph-website:ro
      - ../../repositories/TFS-Website-Revamp-2022/storage/logs:/var/log/laravel/tfs-website:ro
      - ../../repositories/TFS-Website-Revamp-CMS/storage/logs:/var/log/laravel/tfs-cms:ro

      # Alloy positions and state
      - alloy-data:/var/lib/alloy

    depends_on:
      - loki

    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  dev-network:
    external: true

volumes:
  grafana-data:
  loki-data:
  alloy-data:
