; Always re-read bind-mounted application code during local development.
opcache.enable=0
opcache.enable_cli=0
realpath_cache_ttl=0

; Avoid stale stat results for files changed on the host.
realpath_cache_size=0

display_errors=On
display_startup_errors=On
error_reporting=E_ALL

upload_max_filesize=5M
post_max_size=8M
