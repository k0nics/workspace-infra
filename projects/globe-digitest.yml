name: globe-digitest

services:
  app:
    build:
      context: ../docker-infra/images/php-dev
      dockerfile: Dockerfile

    image: laravel-php83-dev:local
    container_name: globe-digitest

    restart: "no"
    working_dir: /app

    command:
      - sh
      - /usr/local/bin/start-laravel-php-fpm

    volumes:
      - ../repositories/globe-digitest:/app
      - ../docker-infra/scripts/start-laravel-php-fpm.sh:/usr/local/bin/start-laravel-php-fpm:ro

    env_file:
      - ../repositories/globe-digitest/.env

    environment:
      APP_URL: http://globe-digitest-ben-local.localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    expose:
      - "9000"

    networks:
      - dev-network

networks:
  dev-network:
    external: true
