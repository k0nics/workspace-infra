name: tisph-cms

services:
  app:
    build:
      context: ../docker-infra/images/php-dev
      dockerfile: Dockerfile

    image: laravel-php83-dev:local
    container_name: tisph-cms

    restart: "no"

    working_dir: /app

    command:
      - sh
      - /usr/local/bin/start-laravel-php-fpm

    volumes:
      - ../repositories/TIS-Admin:/app
      - ../docker-infra/scripts/start-laravel-php-fpm.sh:/usr/local/bin/start-laravel-php-fpm:ro

    env_file:
      - ../repositories/TIS-Admin/.env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306

    expose:
      - "9000"

    networks:
      - dev-network

networks:
  dev-network:
    external: true
