name: tfs-cms

services:
  app:
    build:
      context: ../docker-infra/images/php-dev
      dockerfile: Dockerfile
      args:
        PHP_VERSION: 8.1.33

    image: laravel-php81-dev:local
    container_name: tfs-cms

    restart: "no"
    working_dir: /app

    command:
      - sh
      - /usr/local/bin/start-laravel-php-fpm

    volumes:
      - ../repositories/TFS-Website-Revamp-CMS:/app
      - ../docker-infra/scripts/start-laravel-php-fpm.sh:/usr/local/bin/start-laravel-php-fpm:ro

    env_file:
      - ../repositories/TFS-Website-Revamp-CMS/.env

    environment:
      APP_URL: http://tfs-cms-ben-local.localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306

    expose:
      - "9000"

    networks:
      - dev-network

networks:
  dev-network:
    external: true
