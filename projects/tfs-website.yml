name: tfs-website

services:
  app:
    build:
      context: ../docker-infra/images/php-dev
      dockerfile: Dockerfile
      args:
        PHP_VERSION: 8.3.36

    image: laravel-php83-dev:local
    container_name: tfs-website

    restart: "no"
    working_dir: /app

    command:
      - sh
      - /usr/local/bin/start-laravel-php-fpm

    volumes:
      - ../repositories/TFS-Website-Revamp-2022:/app
      - ../docker-infra/scripts/start-laravel-php-fpm.sh:/usr/local/bin/start-laravel-php-fpm:ro

    env_file:
      - ../repositories/TFS-Website-Revamp-2022/.env

    environment:
      APP_URL: http://tfs-website-ben-local.localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306

    expose:
      - "9000"

    networks:
      - dev-network

networks:
  dev-network:
    external: true
